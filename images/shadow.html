<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .t_Shadow {
            text-shadow: 10px 0px 7px grey;
            color: brown;
            font-size: 70px;
            text-align: center;
        }
        .b_shadow{
            width:400px ;
            box-shadow: 6px 7px 8px brown;
        }
        .d_shadow{
            width: 500px;
            filter: drop-shadow(5px 6px 7px brown);
        }
    </style>
</head>

<body>
    <img src="cat.png" class="d_shadow">
    <h1 class="t_Shadow">Shweta</h1>
    <img src="im2.jpg" alt="iron man" class="b_shadow"/>
</body>
</html>
