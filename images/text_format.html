<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <!-- <link rel="stylesheet" href="style.css"> -->
    <style>
          .t_decor_underling{
        text-decoration: underline;
    }
    .t_transform_capitilize{
        text-transform: capitalize;
    }
    .t_transform_uppercase{
        text-transform:uppercase;
    }
       .t_transform_lowercase{
        text-transform:lowercase;
    }
    .t_decor_all{
        text-decoration:underline overline line-through lowercase uppercase;

    }
    .t_align_r{
        text-align:right;
    }
     .t_align_l{
        text-align:left;
    }
     .t_align_c{
        text-align:center;
    }
    .t_shadow{
        font-size: 90px;
        color:bown;
        text-shadow: 7px 6px 10px gray;

    }
    </style>
</head>
<body>
    <h1 class="t_shadow">hi sai</h1>
    <h1 class="t_align_l">heloo dikshaa an ambuu</h1>
     <h1 class="t_align_r">heloo dikshaa an ambuu</h1>
      <h1 class="t_align_c">heloo dikshaa an ambuu</h1>
    <h1 class="t_transform_uppercase t_decor_underling t_transform_lowercase t_transform_overline t_transform_line-through">hi i am sachitanand</h1>
    <h1 class="t_decor_underling">hello tanuu</h1>
    <h1 class="t_transform_uppercase">this is example of text formatting</h1>
     <h1 class="t_transform_lowercase">this is example of text formatting</h1>

     <h1 class="t_transform_capitilize">this is sachitanand</h1>
</body>
</html>
