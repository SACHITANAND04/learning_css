<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
    /* solid , dotted, dashed */
        .b_property{
            border: 15px dashed ;
            width: 500px;
        }
        .b_property2{
            border: 15px groove red ;
            width: 500px;
        }
         .b_property3{
            border: 15px solid ;
            width: 500px;
        }
          .b_property4{
            border: 15px solid grey ;
            width: 500px;
            border-top-color: black;
            border-right-color:aqua;
            border-bottom-color:black;
            border-left-color: aqua;
            border-radius: 40px 140px 20px 100px;
        }
    </style>
</head>
<body>
    <img src="im2.jpg" class="b_property"/>
     <img src="im2.jpg" class="b_property2"/>
      <img src="im2.jpg" class="b_property3"/>
       <img src="im2.jpg" class="b_property4"/>
</body>
</html>
